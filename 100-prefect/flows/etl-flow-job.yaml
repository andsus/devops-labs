apiVersion: batch/v1
kind: Job
metadata:
  name: etl-flow
  namespace: prefect
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flow
          image: prefecthq/prefect:3-latest
          env:
            - name: PREFECT_API_URL
              value: "http://prefect-server.prefect.svc.cluster.local:4200/api"
          command: ["sh", "-c"]
          args:
            - |
              pip install -q httpx pandas && python - <<'EOF'
              from __future__ import annotations
              from pathlib import Path
              from typing import Any

              import httpx
              import pandas as pd
              from prefect import flow, task


              @task(retries=3, retry_delay_seconds=[2, 5, 15])
              def fetch_page(page: int, api_base: str, per_page: int) -> list[dict[str, Any]]:
                  url = f"{api_base}/articles"
                  params = {"page": page, "per_page": per_page}
                  print(f"Fetching page {page} ...")
                  response = httpx.get(url, params=params, timeout=30)
                  response.raise_for_status()
                  return response.json()


              @task
              def to_dataframe(raw_articles: list[list[dict[str, Any]]]) -> pd.DataFrame:
                  records = [article for page in raw_articles for article in page]
                  df = pd.json_normalize(records)[[
                      "id", "title", "published_at", "url",
                      "comments_count", "positive_reactions_count",
                      "tag_list", "user.username",
                  ]]
                  return df


              @task
              def save_csv(df: pd.DataFrame, path: Path) -> None:
                  df.to_csv(path, index=False)
                  print(f"Saved {len(df)} rows to {path}\n\nPreview:\n{df.head().to_string()}\n")


              @flow(name="devto_etl", log_prints=True)
              def etl(api_base: str, pages: int, per_page: int, output_file: Path) -> None:
                  raw_pages = []
                  for page_number in range(1, pages + 1):
                      raw_pages.append(fetch_page(page_number, api_base, per_page))
                  df = to_dataframe(raw_pages)
                  save_csv(df, output_file)


              etl(
                  api_base="https://dev.to/api",
                  pages=3,
                  per_page=10,
                  output_file=Path("/tmp/devto_articles.csv"),
              )
              EOF
