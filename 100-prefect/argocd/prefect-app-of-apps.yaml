apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prefect
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: prefect
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andsus/devops-labs.git
    targetRevision: main
    path: 100-prefect/argocd
    directory:
      recurse: false
      exclude: prefect-app-of-apps.yaml   # prevent self-referencing
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
