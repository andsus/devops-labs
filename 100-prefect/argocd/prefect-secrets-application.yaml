# =============================================================================
# Prefect Secrets Application
# =============================================================================
# This application deploys any sealed secrets defined in the secrets directory
# (e.g. prefect-db-sealedsecret.yaml) to the 'prefect' namespace.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prefect-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: prefect
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andsus/devops-labs.git
    targetRevision: main
    path: 100-prefect/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: prefect
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
