apiVersion: v1
kind: Service
metadata:
  name: prowler-api
  namespace: prowler
spec:
  selector:
    app: prowler-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: prowler-ui
  namespace: prowler
spec:
  selector:
    app: prowler-ui
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: prowler-mcp
  namespace: prowler
spec:
  selector:
    app: prowler-mcp
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: prowler-neo4j
  namespace: prowler
spec:
  selector:
    app: prowler-neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
