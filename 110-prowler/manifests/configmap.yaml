apiVersion: v1
kind: ConfigMap
metadata:
  name: prowler-config
  namespace: prowler
data:
  # PostgreSQL
  POSTGRES_HOST: "prowler-postgresql"
  POSTGRES_PORT: "5432"
  # Neo4j
  NEO4J_HOST: "prowler-neo4j"
  NEO4J_PORT: "7687"
  ATTACK_PATHS_BATCH_SIZE: "1000"
  ATTACK_PATHS_SERVICE_UNAVAILABLE_MAX_RETRIES: "3"
  ATTACK_PATHS_READ_QUERY_TIMEOUT_SECONDS: "30"
  ATTACK_PATHS_MAX_CUSTOM_QUERY_NODES: "250"
  # Valkey (Redis-compatible)
  VALKEY_SCHEME: "redis"
  VALKEY_HOST: "prowler-valkey-master"
  VALKEY_PORT: "6379"
  VALKEY_DB: "0"
  VALKEY_USERNAME: ""
  VALKEY_PASSWORD: ""
  # Django API
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,prowler-api,prowler.upandrunning.local"
  DJANGO_BIND_ADDRESS: "0.0.0.0"
  DJANGO_PORT: "8080"
  DJANGO_DEBUG: "False"
  DJANGO_SETTINGS_MODULE: "config.django.production"
  DJANGO_LOGGING_FORMATTER: "human_readable"
  DJANGO_LOGGING_LEVEL: "INFO"
  DJANGO_WORKERS: "1"
  DJANGO_WORKER_TIMEOUT: "120"
  GUNICORN_CMD_ARGS: "--timeout 180 --graceful-timeout 180"
  DJANGO_ACCESS_TOKEN_LIFETIME: "30"
  DJANGO_REFRESH_TOKEN_LIFETIME: "1440"
  DJANGO_CACHE_MAX_AGE: "3600"
  DJANGO_STALE_WHILE_REVALIDATE: "60"
  DJANGO_COMPLIANCE_CACHE_WARMUP: "false"
  DJANGO_MANAGE_DB_PARTITIONS: "True"
  DJANGO_TMP_OUTPUT_DIRECTORY: "/tmp/prowler_api_output"
  DJANGO_FINDINGS_BATCH_SIZE: "1000"
  DJANGO_BROKER_VISIBILITY_TIMEOUT: "86400"
  DJANGO_THROTTLE_TOKEN_OBTAIN: "50/minute"
  TASK_RETRY_DELAY_SECONDS: "0.1"
  TASK_RETRY_ATTEMPTS: "5"
  # UI
  AUTH_URL: "http://prowler.upandrunning.local"
  API_BASE_URL: "http://prowler-api:8080/api/v1"
  NEXT_PUBLIC_API_BASE_URL: "http://prowler.upandrunning.local/api/v1"
  NEXT_PUBLIC_API_DOCS_URL: "http://prowler.upandrunning.local/api/v1/docs"
  AUTH_TRUST_HOST: "true"
  # MCP
  PROWLER_MCP_SERVER_URL: "http://prowler-mcp:8000/mcp"
  PROWLER_MCP_TRANSPORT_MODE: "http"
  # RSS
  RSS_FEED_SOURCES: '[{"id":"prowler-releases","name":"Prowler Releases","type":"github_releases","url":"https://github.com/prowler-cloud/prowler/releases.atom","enabled":true}]'
