apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prowler
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: prowler
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andsus/devops-labs.git
    targetRevision: main
    path: 110-prowler/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: prowler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
